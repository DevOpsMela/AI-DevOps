[project]
name = "kube_yaml_creator"
version = "0.1.0"
description = "kube-yaml-creator using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.7"
]

[project.scripts]
kube_yaml_creator = "kube_yaml_creator.main:run"
run_crew = "kube_yaml_creator.main:run"
train = "kube_yaml_creator.main:train"
replay = "kube_yaml_creator.main:replay"
test = "kube_yaml_creator.main:test"
run_with_trigger = "kube_yaml_creator.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
